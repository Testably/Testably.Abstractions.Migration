version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "23:20"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "23:20"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore
    groups:
      nuke:
        patterns:
          - "Nuke*"
      tunit:
        patterns:
          - "tunit*"
      aweXpect:
        patterns:
          - "aweXpect*"
      Testably:
        patterns:
          - "Testably*"
